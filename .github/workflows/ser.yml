name: Fast BatVoice Server with GDrive, Superuser & Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Rclone & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      - name: Setup Rclone Config from GitHub Secret
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf

      - name: Restore Database & Media (APKs) from Google Drive (Zero Loss)
        run: |
          echo "Restoring database and media from Google Drive..."
          rclone copy gdrive:batvoice_backup/db.sqlite3 ./ || echo "No previous DB found, starting fresh."
          rclone copy gdrive:batvoice_backup/media/ ./media/ || echo "No previous media found."

      - name: Run Migrations, Collect Static & Ensure Superuser Exists
        env:
          DJANGO_SUPERUSER_USERNAME: ${{ secrets.SUPERUSER_NAME }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
          DJANGO_SUPERUSER_EMAIL: "admin@uqn88.store"
        run: |
          python manage.py migrate
          python manage.py collectstatic --noinput
          
          # Yeh script check karegi ke agar user pehle se nahi hai toh naya bana degi automatically
          python manage.py shell -c "
          from django.contrib.auth import get_user_model;
          User = get_user_model();
          username = '$DJANGO_SUPERUSER_USERNAME';
          if username and not User.objects.filter(username=username).exists():
              User.objects.create_superuser(username=username, password='$DJANGO_SUPERUSER_PASSWORD', email='$DJANGO_SUPERUSER_EMAIL')
              print(f'Superuser {username} created successfully!')
          else:
              print('Superuser already exists or username is empty.')
          "

      - name: Start Django Server in Background
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          sleep 3

      - name: Start Cloudflare Tunnel (Permanent Domain)
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ ! -f "./cloudflared" ]; then
            curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x cloudflared
          fi

          echo "=========================================="
          echo " Server is live at: https://update-bat.uqn88.store"
          echo "=========================================="

          # Named tunnel run jo aapke subdomain par traffic bhejega
          ./cloudflared tunnel run --token "$TUNNEL_TOKEN" &

          # Server ko 2 ghante (7200 seconds) tak live rakhne ke liye
          sleep 7200

      - name: Backup Database & APKs back to Google Drive before Exit (Zero Loss)
        if: always() # Chahe action timeout ho ya cancel, yeh step chal kar data Google Drive par save kar dega
        run: |
          echo "Backing up database and media/APKs to Google Drive..."
          rclone copy ./db.sqlite3 gdrive:batvoice_backup/ || true
          rclone copy ./media/ gdrive:batvoice_backup/media/ || true
